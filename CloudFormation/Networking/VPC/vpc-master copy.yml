AWSTemplateFormatVersion: '2010-09-09'

Parameters:
  PublicSubnetTemplateUrl:
    Type: String
  outingTableTemplateUrl:
    Type: String


Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: 'true'
      EnableDnsHostnames: 'true'
      Tags:
       - Key: Name
         Value: cloudformation-test-vpc

  PublicSubnet:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - VPC
    Properties:
      TemplateURL: !Ref PublicSubnetTemplateUrl

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: 
        - Key: Name
          Value: !Sub "${VPC.VpcId}-igw"
  
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !GetAtt InternetGateway.InternetGatewayId
      VpcId: !GetAtt VPC.VpcId
  
  RoutingTable:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - VPC
    Properties:
      TemplateURL: !Ref RoutingTableTemplateUrl

Outputs:
  VpcId: 
    Value: !GetAtt VPC.VpcId
    Export:
      Name: VpcId
  DefaultSecurityGroup:
    Value: !GetAtt VPC.DefaultSecurityGroup
    Export:
      Name: VpcDefaultSecurityGroup
  CidrBlock:
    Value: !GetAtt VPC.CidrBlock
    Export:
      Name: VpcCidrBlock
  InternetGatewayId:
    Value: !GetAtt InternetGateway.InternetGatewayId
    Export:
      Name: InternetGatewayId